name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
          python -m pip install pyyaml
      - name: Pytest (unit + shortlist golden + access pack)
        run: python -m pytest tests/ -q --tb=short
      - name: Empty-layer guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assets = Path("figures/product_assets")
          bad = []
          # Live tree only (explicitly skip quarantine/ and any nested archive)
          for p in assets.rglob("*.geojson"):
              if "quarantine" in p.parts:
                  continue
              if any(part.startswith(".") for part in p.parts):
                  continue
              try:
                  g = json.loads(p.read_text())
              except Exception as e:
                  bad.append(f"{p.relative_to(assets)}: unreadable {e}")
                  continue
              feats = g.get("features")
              if isinstance(feats, list) and len(feats) == 0:
                  bad.append(f"{p.relative_to(assets)}: empty FeatureCollection (move to quarantine/ or delete)")
          live = assets / "catch_basins.geojson"
          if live.exists():
              g = json.loads(live.read_text())
              if not g.get("features"):
                  bad.append("catch_basins.geojson empty in live tree")
          vendor_leaflet = Path("figures/vendor/leaflet/1.9.4/leaflet.js")
          vendor_fonts = Path("figures/vendor/fonts/fonts.css")
          if not vendor_leaflet.exists() or not vendor_fonts.exists():
              bad.append("figures/vendor missing Leaflet/fonts — run scripts/vendor_static_assets.py")
          if bad:
              raise SystemExit("Empty-layer guard failed:\\n- " + "\\n- ".join(bad))
          print("empty-layer guard ok")
          PY
